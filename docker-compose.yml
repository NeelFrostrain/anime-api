services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kuromi-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=KUROMI
      - SECRET_KEY=kuromi-super-secret-jwt-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - DATABASE_URL=sqlite:///./kuromi.db
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - kuromi-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kuromi-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_APP_NAME=KUROMI
    depends_on:
      - backend

volumes:
  kuromi-data:
    driver: local
